<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Taakplanner</title><style> *{box-sizing:border-box}body{font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f3f5f8;color:#182638;margin:0}main{max-width:1000px;margin:auto;padding:18px}h1{margin:0}h2{font-size:20px}small{color:#536477}section{background:white;border-radius:16px;padding:16px;margin:14px 0}button,input,select{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#245d83;color:white;border:0;width:100%;margin-top:12px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}nav button.active{background:#245d83;color:white}.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chips label{padding:12px;background:#f2f5f8;border-radius:9px;display:flex;align-items:center;gap:8px}.chips input{width:20px;height:20px;accent-color:#245d83}.task{padding:12px 0;border-bottom:1px solid #e1e6eb;display:grid;gap:7px}.task select{width:100%}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #b8c2ce;padding:7px;vertical-align:top}th{background:#e5edf5}#status{color:#536477} @media print {

</style><main><h1>Taakplanner 2.4</h1><small>Winkelmanagement · maandag tot zaterdag</small><section class="controls"><label>Jaar <input id="year" type="number" min="1900" max="9999" style="width:95px"></label> <label>Week <input id="week" type="number" min="1" max="53" value="1" style="width:85px"></label> <button id="open">Open week</button> <button onclick="moveWeek(-1)">‹</button> <button onclick="moveWeek(1)">›</button> <button onclick="goToday()">Deze week</button><p id="period"></p><nav id="nav"></nav><p id="status"></p></section><section id="content"></section></main><script>
const days=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];let names=[];try{names=JSON.parse(localStorage.getItem('taakplanner-names')||'[]')}catch(e){};const tasks=['Zakken aanvullen','Inpakmateriaal aanvullen','Stalen en materiaal voor stalen te maken aanvullen',"Kassa’s en kast achter kassa’s opruimen",'Vuilbakken legen','Karton samenbinden','Oude/lege testers sorteren','Levering kartonnen dozen openen','Vloer proper houden (geurstokjes/linten)','Testers aanvullen/vervangen','Cadeaus en acties op rek aanvullen'];function iso(date){let t=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));let y=t.getUTCFullYear();return {y,w:Math.ceil(((t-new Date(Date.UTC(y,0,1)))/86400000+1)/7)}}function monday(y,w){let t=new Date(y,0,4,12);t.setDate(t.getDate()-(t.getDay()+6)%7+7*(w-1));return t}function maxWeek(y){return iso(new Date(y,11,28)).w}function key(y,w){return y+'-W'+String(w).padStart(2,'0')}let now=iso(new Date()),y=now.y,w=now.w,d=0,tab=0;let db={};try{db=JSON.parse(localStorage.getItem('taakplanner-iso-v1'))||db}catch(e){}const $=id=>document.getElementById(id);function dateAt(i){let t=monday(y,w);t.setDate(t.getDate()+i);return t}function fmt(t){return t.toLocaleDateString('nl-BE',{day:'numeric',month:'short'})}function dayLabel(i){return days[i]+' '+fmt(dateAt(i))}function weekLabel(){return 'Week '+w+' / '+y+' · '+fmt(dateAt(0))+' – '+fmt(dateAt(5))}function selectWeek(yy,ww){y=yy;w=ww;d=0;tab=0;render()}function moveWeek(n){let t=monday(y,w);t.setDate(t.getDate()+7*n);let k=iso(t);selectWeek(k.y,k.w)}function goToday(){let k=iso(new Date());selectWeek(k.y,k.w)}function save(){try{localStorage.setItem('taakplanner-iso-v1',JSON.stringify(db));$('status').textContent=weekLabel()+' · lokaal opgeslagen'}catch(e){$('status').textContent='Opslag niet beschikbaar: maak een back-up.'}}function current(){return db[key(y,w)]||(db[key(y,w)]={abs:days.map(()=>[]),plan:[]})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function generate(){if(!names.length){alert('Voeg eerst medewerkers toe.');return}let a=current();if(a.abs.some(x=>names.every(n=>x.includes(n)))){alert('Minstens één medewerker moet per dag aanwezig zijn.');return}if(a.plan.length&&!confirm('Bestaande taakverdeling vervangen?'))return;let total={},hist={};names.forEach(n=>{total[n]=0;hist[n]=tasks.map(()=>0)});Object.keys(db).filter(k=>k<key(y,w)).forEach(k=>db[k].plan.forEach(row=>row.forEach((n,t)=>{if(hist[n])hist[n][t]++})));a.plan=days.map((_,i)=>{let daily={};names.forEach(n=>daily[n]=0);return tasks.map((_,t)=>{let n=names.filter(n=>!a.abs[i].includes(n)).sort((x,y)=>daily[x]-daily[y]||total[x]-total[y]||hist[x][t]-hist[y][t]||names.indexOf(x)-names.indexOf(y))[0];daily[n]++;total[n]++;hist[n][t]++;return n})});save();tab=1;render()}function dayPicker(){return '<div class="noPrint"><label>Dag <select onchange="d=+this.value;render()">'+days.map((x,i)=>`<option value="${i}" ${d===i?'selected':''}>${dayLabel(i)}</option>`).join('')+'</select></label></div>'}function render(){$('year').value=y;$('week').value=w;$('week').max=maxWeek(y);$('period').textContent=weekLabel();let a=current();$('nav').innerHTML=['Vrije dagen','Taken verdelen','Per taak','Per persoon','Back-up','WhatsApp','Medewerkers'].map((x,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${x}</button>`).join('');let h=`<h2>${weekLabel()} · ${['Vrije dagen','Taken verdelen','Taakplanning','Taken per persoon','Back-up','WhatsApp','Medewerkers'][tab]}</h2>`;if(tab===6){h+='<p>Voer de medewerkers in, één naam per regel. Namen worden alleen lokaal opgeslagen.</p><textarea id="staff" rows="15" style="width:100%;font:inherit">'+esc(names.join('\n'))+'</textarea><button class="primary" onclick="saveStaff()">Medewerkers opslaan</button>'}else if(tab===0){h+=dayPicker()+`<p>Vink aan wie ${days[d].toLowerCase()} niet aanwezig is.</p><div class="chips">`+names.map(n=>`<label><input type="checkbox" ${a.abs[d].includes(n)?'checked':''} onchange="absence('${n}',this.checked)">${esc(n)}</label>`).join('')+'</div><p>'+ (names.length-a.abs[d].length)+' aanwezig</p><button class="primary" onclick="generate()">Maak taakplanning</button>'}else if(tab===1){h+=dayPicker();if(!a.plan.length)h+='<p>Maak eerst een taakplanning.</p>';else h+=tasks.map((t,i)=>`<div class="task"><b>${esc(t)}</b><select onchange="current().plan[d][${i}]=this.value;save()">`+names.filter(n=>!a.abs[d].includes(n)).map(n=>`<option ${a.plan[d][i]===n?'selected':''}>${esc(n)}</option>`).join('')+'</select></div>').join('');h+='<button class="primary" onclick="generate()">Opnieuw verdelen</button>'}else if(tab===2||tab===3){if(!a.plan.length)h+='<p>Maak eerst een taakplanning.</p>';else{h+='<div class="scroll"><table class="'+(tab===2?'by-task':'by-person')+'"><thead><tr><th>'+(tab===2?'Taak':'Medewerker')+'</th>'+days.map((x,i)=>'<th><span class="print-day">'+x+'</span> <span class="print-date">'+fmt(dateAt(i))+'</span></th>').join('')+'</tr></thead><tbody>';if(tab===2){h+=tasks.map((t,i)=>'<tr><th>'+esc(t)+'</th>'+a.plan.map(row=>'<td>'+esc(row[i])+'</td>').join('')+'</tr>').join('');h+='<tr><th>Niet aanwezig</th>'+a.abs.map(x=>'<td>'+esc(x.join(', '))+'</td>').join('')+'</tr>'}else h+=names.map(n=>'<tr><th>'+esc(n)+'</th>'+a.plan.map((row,i)=>'<td>'+(a.abs[i].includes(n)?'Afwezig':row.map((p,t)=>p===n?esc(tasks[t]):'').filter(Boolean).join('<br>')||'—')+'</td>').join('')+'</tr>').join('');h+='</tbody></table></div><button class="primary noPrint" onclick="window.print()">Afdrukken / PDF</button><p class="noPrint">Op iPhone: open de afdrukvoorvertoning en gebruik Delen om de PDF via WhatsApp te versturen.</p>'}}else if(tab===5){h+=sharePanel()}else h+='<p>Bewaar een kopie van alle weken buiten deze browser.</p><button onclick="backup()">Back-up downloaden</button><p>Back-up herstellen:</p><input type="file" accept=".json,application/json" onchange="restore(this)">';$('content').innerHTML=h;save()}function absence(n,on){let a=current();if(on&&a.plan.length&&a.plan[d].includes(n)){if(!confirm('Deze medewerker heeft taken. De bestaande planning wissen?')){render();return}a.plan=[]}a.abs[d]=on?[...new Set([...a.abs[d],n])]:a.abs[d].filter(x=>x!==n);render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({names,weeks:db,phones,format:"iso-v1"})],{type:'application/json'}));a.download='taakplanner-backup.json';a.click()}async function restore(el){try{let raw=JSON.parse(await el.files[0].text());let b=raw.weeks||raw;let imported=raw.names||[...new Set(Object.values(b).flatMap(a=>[...a.abs.flat(),...a.plan.flat()]))];if(!validStaff(imported))throw Error();let allowed=imported.length?imported:names;if(!Object.keys(b).every(k=>/^\d{4}-W\d{2}$/.test(k)&&+k.slice(6)>=1&&+k.slice(6)<=maxWeek(+k.slice(0,4)))){alert("Oude back-up zonder kalenderjaar: behoud deze in versie 2.0.");return}if(!Object.values(b).every(a=>Array.isArray(a.abs)&&a.abs.length===6&&Array.isArray(a.plan)&&(a.plan.length===0||a.plan.length===6)&&a.abs.every(r=>Array.isArray(r)&&r.every(n=>allowed.includes(n)))&&a.plan.every((r,i)=>Array.isArray(r)&&r.length===11&&r.every(n=>allowed.includes(n)&&!a.abs[i].includes(n)))))throw Error();if(confirm('Alle opgeslagen weken vervangen?')){names=allowed;localStorage.setItem('taakplanner-names',JSON.stringify(names));sharePerson=names[0]||'';db=b;if(raw.weeks){phones=Object.fromEntries(names.map(n=>[n,normalizePhone(raw.phones?.[n]||'')]).filter(x=>x[1]));savePhones()}render()}}catch(e){alert('Ongeldige back-up')}}
let phones={};try{phones=JSON.parse(localStorage.getItem('taakplanner-phones')||'{}')}catch(e){}let shareMode='week',sharePerson=names[0]||'',shareDay=0;
function normalizePhone(v){let n=String(v).replace(/[\s().-]/g,'');if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('+'))n=n.slice(1);else if(n.startsWith('0'))n='32'+n.slice(1);return /^[1-9]\d{7,14}$/.test(n)?n:''}
function savePhones(){try{localStorage.setItem('taakplanner-phones',JSON.stringify(phones))}catch(e){alert('Gsm-nummers konden niet lokaal worden opgeslagen. Maak een back-up.')}}
function setPhone(n,v){let x=normalizePhone(v);if(v.trim()&&!x){alert('Gebruik een geldig gsm-nummer, bijvoorbeeld +32 4xx xx xx xx.');render();return}if(x)phones[n]=x;else delete phones[n];savePhones();render()}
function message(){let a=current();if(!a.plan.length)return '';let out=['Taakplanning – '+weekLabel()];if(shareMode==='person')out.unshift('Hallo '+sharePerson+',');let indices=shareMode==='day'?[shareDay]:[0,1,2,3,4,5];for(let i of indices){out.push('',dayLabel(i)+':');if(shareMode==='person'){if(a.abs[i].includes(sharePerson))out.push('Vrij');else{let ts=tasks.filter((t,j)=>a.plan[i][j]===sharePerson);out.push(...(ts.length?ts.map(t=>'• '+t):['Geen taak toegewezen']))}}else{out.push(...names.filter(n=>a.plan[i].includes(n)).map(n=>n+': '+tasks.filter((t,j)=>a.plan[i][j]===n).join('; ')))}}out.push('','Bedankt en fijne werkweek!');return out.join('\n')}
function sharePanel(){let h='<p>De manager kiest de ontvanger en bevestigt het bericht in WhatsApp.</p><label>Bericht <select onchange="shareMode=this.value;render()">'+[['week','Volledige week'],['day','Eén dag'],['person','Per medewerker']].map(([v,t])=>`<option value="${v}" ${shareMode===v?'selected':''}>${t}</option>`).join('')+'</select></label>';if(shareMode==='day')h+='<p><select onchange="shareDay=+this.value;render()">'+days.map((n,i)=>`<option value="${i}" ${shareDay===i?'selected':''}>${dayLabel(i)}</option>`).join('')+'</select></p>';if(shareMode==='person')h+='<p><select onchange="sharePerson=this.value;render()">'+names.map(n=>`<option ${sharePerson===n?'selected':''}>${esc(n)}</option>`).join('')+'</select></p>';if(current().plan.length){h+='<p>Voorbeeldbericht (aanpasbaar)</p><textarea id="msg" rows="12" style="width:100%;font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:9px">'+esc(message())+'</textarea><button class="primary" style="background:#187b49" onclick="sendWA()">Open WhatsApp</button><button class="primary" onclick="shareNative()">Delen via iPhone</button><button style="margin-top:8px" onclick="copyMsg()">Kopieer bericht</button>'}else h+='<p>Maak eerst een taakplanning.</p>';h+='<h2>Gsm-nummers (optioneel)</h2><p>Belgische nummers worden omgezet naar +32. Gebruik +landcode voor buitenlandse nummers.</p>'+names.map(n=>`<div class="task"><label>${esc(n)}<input style="width:100%;margin-top:5px" type="tel" placeholder="+32 …" value="${esc(phones[n]?'+'+phones[n]:'')}" onchange="setPhone('${n}',this.value)"></label></div>`).join('');return h}
function sendWA(){let n=shareMode==='person'?phones[sharePerson]||'':'';let url='https://wa.me/'+n+'?text='+encodeURIComponent($('msg').value);if(url.length>7500){alert('Dit bericht is lang. Gebruik Delen via iPhone of Kopieer bericht.');return}window.open(url,'_blank','noopener,noreferrer')}
async function copyMsg(){try{await navigator.clipboard.writeText($('msg').value);alert('Bericht gekopieerd.')}catch(e){$('msg').focus();$('msg').select();alert('Kopieer de geselecteerde tekst handmatig.')}}
async function shareNative(){if(navigator.share){try{await navigator.share({text:$('msg').value})}catch(e){if(e.name!=='AbortError')copyMsg()}}else copyMsg()}

function validStaff(a){return Array.isArray(a)&&a.length<=100&&new Set(a).size===a.length&&a.every(n=>typeof n==='string'&&/^[\p{L}\p{M}0-9 .-]{1,60}$/u.test(n))}function saveStaff(){let a=$('staff').value.split(/\r?\n/).map(n=>n.trim()).filter(Boolean);if(!a.length||!validStaff(a)){alert('Gebruik unieke namen met letters, cijfers, spaties of een koppelteken.');return}if(Object.values(db).some(v=>v.abs.flat().some(n=>!a.includes(n))||v.plan.flat().some(n=>!a.includes(n)))){alert('Maak een back-up. Namen uit bestaande roosters kunnen niet worden verwijderd.');return}names=a;try{localStorage.setItem('taakplanner-names',JSON.stringify(names))}catch(e){alert('Lokale opslag niet beschikbaar.')}sharePerson=names[0];tab=0;render()}if(!names.length)tab=6;$('open').onclick=()=>{let yy=+$('year').value,v=+$('week').value;if(!Number.isInteger(yy)||yy<1900||yy>9999||!Number.isInteger(v)||v<1||v>maxWeek(yy)){alert('Kies een geldig jaar en weeknummer.');return}selectWeek(yy,v)};render();</script></html>
